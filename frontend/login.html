<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSpots - Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --verde: #166534; --verde-osc: #14532d; --texto: #1f2937; --gris: #64748b; --borde: #cbd5e1; --error: #b91c1c; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #14532d 0%, #166534 55%, #22c55e 100%); padding: 16px; color: var(--texto);
        }
        .caja { background: #fff; width: 100%; max-width: 380px; border-radius: 12px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        h1 { margin: 0 0 4px; font-size: 26px; color: var(--verde); }
        p.sub { margin: 0 0 24px; color: var(--gris); font-size: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: 15px; }
        input:focus { outline: 2px solid #86efac; border-color: var(--verde); }
        button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; background: var(--verde); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--verde-osc); }
        button:disabled { opacity: .6; cursor: wait; }
        .msg { margin-top: 14px; font-size: 14px; min-height: 20px; }
        .msg.error { color: var(--error); }
        .nota { margin-top: 18px; font-size: 12px; color: var(--gris); }
        .oculto { display: none; }
    </style>
</head>

<body>
    <div class="caja">
        <h1><i class="fas fa-seedling"></i> GeoSpots</h1>
        <p class="sub" id="subtitulo">Inicia sesión para continuar</p>

        <form id="form-login" autocomplete="on">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="username" autocomplete="username" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" id="btn-login">Entrar</button>
        </form>

        <form id="form-cambio" class="oculto" autocomplete="off">
            <label for="nueva">Nueva contraseña</label>
            <input id="nueva" type="password" autocomplete="new-password" minlength="8" required>
            <label for="nueva2">Repite la nueva contraseña</label>
            <input id="nueva2" type="password" autocomplete="new-password" minlength="8" required>
            <button type="submit" id="btn-cambio">Guardar y entrar</button>
        </form>

        <div class="msg" id="msg" role="alert"></div>
        <div class="nota">¿No tienes cuenta u olvidaste la contraseña? Pídela al administrador.</div>
    </div>

    <script>
        const msg = document.getElementById('msg');
        let passwordTemporal = '';

        function error(t) { msg.className = 'msg error'; msg.textContent = t; }

        async function post(url, body) {
            const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.detail || 'Error inesperado');
            return data;
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true; msg.textContent = '';
            const password = document.getElementById('password').value;
            try {
                const data = await post('/api/auth/login', { usuario: document.getElementById('usuario').value, password });
                if (data.usuario.debe_cambiar_password) {
                    passwordTemporal = password;
                    document.getElementById('form-login').classList.add('oculto');
                    document.getElementById('form-cambio').classList.remove('oculto');
                    document.getElementById('subtitulo').textContent = 'Es tu primer ingreso: crea una contraseña nueva (mínimo 8 caracteres).';
                    document.getElementById('nueva').focus();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                error(err.message);
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('form-cambio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nueva = document.getElementById('nueva').value;
            if (nueva !== document.getElementById('nueva2').value) return error('Las contraseñas no coinciden.');
            const btn = document.getElementById('btn-cambio');
            btn.disabled = true; msg.textContent = '';
            try {
                await post('/api/auth/cambiar-password', { actual: passwordTemporal, nueva });
                window.location.href = '/';
            } catch (err) {
                error(err.message);
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
